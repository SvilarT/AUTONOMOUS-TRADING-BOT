services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  indexes:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      RUNTIME_ROLE: indexes
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: trading_bot
      COINBASE_LIVE_ORDER_KILL_SWITCH: "true"
    command: ["python", "manage_indexes.py"]
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUNTIME_ROLE: api
      API_EMBED_BOT_MANAGER: "false"
      RUN_MONGO_INDEX_BOOTSTRAP: "false"
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: trading_bot
      COINBASE_LIVE_ORDER_KILL_SWITCH: "true"
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
      indexes:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUNTIME_ROLE: worker
      RUN_MONGO_INDEX_BOOTSTRAP: "false"
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: trading_bot
      COINBASE_LIVE_ORDER_KILL_SWITCH: "true"
    command: ["python", "worker.py"]
    depends_on:
      mongo:
        condition: service_healthy
      indexes:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
