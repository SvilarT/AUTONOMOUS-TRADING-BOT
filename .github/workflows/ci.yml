name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests and safety regression suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "True"
      JWT_SECRET: ci-local-secret-with-more-than-32-characters
      SIMULATION_MODE: "True"
      TRADING_MODE: paper
      CORS_ORIGINS: http://localhost:3000
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: trading_bot_ci
      COINBASE_LIVE_ORDER_KILL_SWITCH: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest tests --cov=. --cov-report=term-missing --cov-fail-under=65

  backend-security:
    name: Backend static security checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Bandit security scan
        run: python -m bandit -q -r . -x tests

      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      REACT_APP_BACKEND_URL: http://localhost:8000
      CI: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend
        run: npm run build
