# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow requires that you have an existing account with codescan.io
# For more information about configuring your workflow,
# read our documentation at https://github.com/codescan-io/codescan-scanner-action
name: CodeScan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 5'

permissions:
  contents: read

jobs:
    CodeScan:
        permissions:
          contents: read
          security-events: write
          actions: read
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4

            -   name: Set up Java 17
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: '17'

            -   name: Verify Java runtime
                run: |
                    echo "JAVA_HOME=$JAVA_HOME"
                    java -version
                    echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

            -   name: Cache files
                uses: actions/cache@v3
                with:
                    path: |
                        ~/.sonar
                    key: ${{ runner.os }}-sonar
                    restore-keys: ${{ runner.os }}-sonar

            -   name: Run Analysis
                if: ${{ secrets.CODESCAN_AUTH_TOKEN != '' && secrets.CODESCAN_ORGANIZATION_KEY != '' && secrets.CODESCAN_PROJECT_KEY != '' }}
                uses: codescan-io/codescan-scanner-action@5b2e8c5683ef6a5adc8fa3b7950bb07debccce12
                env:
                    JAVA_HOME: ${{ env.JAVA_HOME }}
                    PATH: ${{ env.JAVA_HOME }}/bin:${{ env.PATH }}
                with:
                    login: ${{ secrets.CODESCAN_AUTH_TOKEN }}
                    organization: ${{ secrets.CODESCAN_ORGANIZATION_KEY }}
                    projectKey: ${{ secrets.CODESCAN_PROJECT_KEY }}

            -   name: Skip notice
                if: ${{ secrets.CODESCAN_AUTH_TOKEN == '' || secrets.CODESCAN_ORGANIZATION_KEY == '' || secrets.CODESCAN_PROJECT_KEY == '' }}
                run: echo "Skipping CodeScan because one or more required CODESCAN_* secrets are not configured."

            -   name: Upload SARIF file
                if: ${{ hashFiles('codescan.sarif') != '' }}
                uses: github/codeql-action/upload-sarif@v3
                with:
                    sarif_file: codescan.sarif
