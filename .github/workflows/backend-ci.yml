name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-tests:
    name: Backend tests and operational guardrails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "true"
      JWT_SECRET: "ci-test-secret-with-more-than-32-characters"
      SIMULATION_MODE: "true"
      TRADING_MODE: "paper"
      LIVE_TRADING_ENABLED: "false"
      LIVE_EXECUTION_ADAPTER: "disabled"
      CORS_ORIGINS: "http://localhost:3000"
      MONGO_URL: "mongodb://localhost:27017"
      DB_NAME: "trading_bot_ci"
      PYTHONPATH: "."
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall .

      - name: Run backend tests
        run: pytest -q

      - name: Validate operational readiness defaults
        run: |
          python - <<'PY'
          from services.operational_readiness_v2 import OperationalReadinessServiceV2
          result = OperationalReadinessServiceV2().validate_environment(strict=False)
          assert result["status"] in {"ready", "degraded"}
          assert any(check["name"] == "live_trading_disabled_by_default" for check in result["checks"])
          PY
