[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  "ignore::DeprecationWarning:passlib.*",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 140
target-version = "py312"
exclude = [
  ".venv",
  "venv",
  "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = [
  "S101",  # pytest assertions are expected in tests
  "S311",  # simulation RNG is not used for cryptographic purposes
]

[tool.ruff.lint.per-file-ignores]
"api_live_security_routes_v2.py" = ["B008"]
"api_routes_v2.py" = ["B008"]
"auth_core.py" = ["B008", "S105"]
"runtime_config.py" = ["S106"]
"services/settings_v2.py" = ["S105"]
"tests/**/*.py" = ["S101", "S105", "S106", "S311"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101", "B311"]
